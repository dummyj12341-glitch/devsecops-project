# Semgrep SAST rules (local file, so the scan works offline and gives the
# same result on every run - no dependency on the Semgrep registry).
#
# All rules use severity ERROR, which this project treats as HIGH:
# the pipeline runs semgrep with --error, so ANY match fails the build.
#
# When the machine is online you can ALSO run the community rulesets:
#   semgrep --config p/python --config p/owasp-top-ten app/
rules:
  - id: flask-debug-enabled
    languages: [python]
    severity: ERROR
    message: >-
      Flask app started with debug=True. The Werkzeug debugger allows remote
      code execution if exposed. Never enable debug outside local development.
    metadata:
      cwe: "CWE-489: Active Debug Code"
      owasp: "A05:2021 - Security Misconfiguration"
    pattern: $APP.run(..., debug=True, ...)

  - id: subprocess-shell-true
    languages: [python]
    severity: ERROR
    message: >-
      subprocess called with shell=True. If any part of the command comes from
      user input this is OS command injection. Pass a list of args and shell=False.
    metadata:
      cwe: "CWE-78: OS Command Injection"
      owasp: "A03:2021 - Injection"
    pattern-either:
      - pattern: subprocess.$FUNC(..., shell=True, ...)
      - pattern: os.system(...)

  - id: dangerous-eval-exec
    languages: [python]
    severity: ERROR
    message: eval()/exec() executes arbitrary code. Use a safe parser instead.
    metadata:
      cwe: "CWE-95: Eval Injection"
      owasp: "A03:2021 - Injection"
    pattern-either:
      - pattern: eval(...)
      - pattern: exec(...)

  - id: unsafe-yaml-load
    languages: [python]
    severity: ERROR
    message: yaml.load() without SafeLoader can construct arbitrary objects. Use yaml.safe_load().
    metadata:
      cwe: "CWE-502: Deserialization of Untrusted Data"
      owasp: "A08:2021 - Software and Data Integrity Failures"
    patterns:
      - pattern: yaml.load(...)
      - pattern-not: yaml.load(..., Loader=yaml.SafeLoader, ...)

  - id: hardcoded-aws-access-key
    languages: [python]
    severity: ERROR
    message: Hardcoded AWS access key id. Load credentials from the environment or a secrets manager.
    metadata:
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 - Identification and Authentication Failures"
    pattern-regex: (A3T[A-Z0-9]|AKIA|ASIA)[A-Z0-9]{16}
